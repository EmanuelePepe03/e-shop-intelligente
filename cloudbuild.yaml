steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Build the application
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']

  # 3. Deploy to VM via SSH/SCP
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Identifica la cartella di build (dist per Vite, build per CRA)
        BUILD_DIR="dist"
        if [ ! -d "$BUILD_DIR" ]; then
          BUILD_DIR="build"
        fi
        
        if [ ! -d "$BUILD_DIR" ]; then
          echo "Errore: Cartella di build non trovata."
          exit 1
        fi

        echo "Trovata cartella di build: $BUILD_DIR"
        
        # Comprime i file per il trasferimento
        tar -czf app-release.tar.gz -C $BUILD_DIR .

        # Copia l'archivio sulla VM
        gcloud compute scp app-release.tar.gz app-vm:~/app-release.tar.gz --zone=europe-west12-b

        # Esegue i comandi sulla VM per aggiornare il sito
        gcloud compute ssh app-vm --zone=europe-west12-b --command='
          # Assicura che la directory di destinazione esista
          sudo mkdir -p /var/www/html
          
          # Pulisce la vecchia versione
          sudo rm -rf /var/www/html/*
          
          # Estrae la nuova versione
          sudo tar -xzf ~/app-release.tar.gz -C /var/www/html/
          
          # Rimuove l'archivio temporaneo
          rm ~/app-release.tar.gz
          
          # Opzionale: Riavvia Nginx per assicurarsi che non ci siano cache
          # sudo systemctl reload nginx || true
        '

# --- QUESTA È LA PARTE CHE RISOLVE L'ERRORE ROSSO ---
options:
  logging: CLOUD_LOGGING_ONLY
