steps:
  # 1. Build: Costruisce l'immagine Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west12-docker.pkg.dev/$PROJECT_ID/my-repo/my-app'
      - '.'

  # 2. Push: Carica l'immagine su Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west12-docker.pkg.dev/$PROJECT_ID/my-repo/my-app'

  # 3. Deploy (SSH): Si collega alla VM e aggiorna il container
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'app-vm'
      - '--zone=europe-west12-b'
      - '--command'
      - |
        docker stop my-app-container || true
        docker rm my-app-container || true
        gcloud auth configure-docker europe-west12-docker.pkg.dev --quiet
        docker pull europe-west12-docker.pkg.dev/$PROJECT_ID/my-repo/my-app
        docker run -d --name my-app-container -p 80:3000 europe-west12-docker.pkg.dev/$PROJECT_ID/my-repo/my-app